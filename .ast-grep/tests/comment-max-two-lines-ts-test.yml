id: comment-max-two-lines-ts
valid:
  - |
    // one
    // two
    const probe = 1;
  - |
    /** one
     * two */
    const probe = 1;
invalid:
  - |
    // one
    // two
    // three
    const probe = 1;
  - |
    // one
    // two

    // three
    const probe = 1;
  - |
    /**
     * one
     */
    const probe = 1;
  - |
    /* one */
    // two
    // three
    const probe = 1;
  - |
    if (ready) {
      run();
    } // one
    // two
    // three
    done();
  - |
    const probe = 1 // one
    // two
    // three
  - |
    class Probe {
      // one
      @observed
      // two
      // three
      value = 1;
    }
