---
id: comment-max-width-js
language: JavaScript
severity: error
message: "Keep each comment line within 100 characters, counted from its first non-space character. Cut words instead of widening the line."
rule:
  any: [{kind: comment}, {kind: html_comment}]
  regex: '(^|\n)[ \t]*[^ \t\r\n][^\r\n]{100,}'
