[package]
name = "talksify"
version = "0.1.0"
description = "Local voice dictation"
authors = ["you"]
edition = "2024"

[lib]
name = "talksify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rubato = "0.16"
toml = "0.8"
cpal = "0.15"
rtrb = "0.3"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
sherpa-onnx = "2.0"
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", branch = "master", features = ["metal"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
[lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
self_named_module_files = "deny"

[lints.rust]
unreachable_pub = "deny"

# Dependencies (mistral.rs, candle, tokenizers...) are optimized even in debug builds: the
# unoptimized binary's unwind tables exceed the macOS linker's 16 MB compact-unwind limit.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
