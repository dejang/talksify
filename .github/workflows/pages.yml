name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare static site
        env:
          REPO: ${{ github.repository }}
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v$(node -p "require('./package.json').version")")
          cp src-tauri/icons/128x128@2x.png site/icon.png
          DMG_URL="https://github.com/${REPO}/releases/download/${TAG}/Talksify.dmg"
          sed -i "s|https://github.com/dejang/talksify/releases/latest/download/Talksify.dmg|${DMG_URL}|g" site/index.html
          sed -i "s|https://github.com/dejang/talksify|https://github.com/${REPO}|g" site/index.html
          sed -i "s|>v0.1.0<|>${TAG}<|g" site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
